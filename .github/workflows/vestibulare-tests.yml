name: Vestibulare tests

on:
  push:
    paths:
      - "custom_components/vestibulare_elshaday/**"
      - "tests/**"
      - ".github/workflows/vestibulare-tests.yml"
  pull_request:
    paths:
      - "custom_components/vestibulare_elshaday/**"
      - "tests/**"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check aiohttp
      - name: Compile integration
        run: python -m compileall -q custom_components/vestibulare_elshaday tests
      - name: Run regression suite (mock portal, no credentials)
        run: python -m unittest discover -s tests -v
